# DigitalOcean App Platform spec
# Deploys automatically from main branch on every push
# Create the app at: https://cloud.digitalocean.com/apps/new
# Choose GitHub → essman929/screenshot-to-code → main branch → "Use existing spec (.do/app.yaml)"

name: screenshot-to-code
region: nyc

services:
  - name: api
    github:
      repo: essman929/screenshot-to-code
      branch: main
      deploy_on_push: true
    source_dir: backend
    build_command: pip install poetry && poetry install --no-dev
    run_command: uvicorn main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: ANTHROPIC_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: REPLICATE_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /ws
        preserve_path_prefix: true

static_sites:
  - name: frontend
    github:
      repo: essman929/screenshot-to-code
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm install --global pnpm && pnpm install && pnpm build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    envs:
      - key: VITE_WS_BACKEND_URL
        value: ${api.PUBLIC_URL}
        scope: BUILD_TIME
    routes:
      - path: /
        preserve_path_prefix: false
